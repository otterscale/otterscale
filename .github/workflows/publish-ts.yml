# Publishes the generated ConnectRPC clients to npm as @otterscale/api.
# The package version tracks the otterscale release tag.
name: Publish Typescript Package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          pnpm version "$VERSION" --no-git-tag-version --allow-same-version
          pnpm install --frozen-lockfile
          if echo "$VERSION" | grep -qE -- '-alpha|-beta|-rc|-next'; then
            pnpm publish --no-git-checks --access public --tag next
          else
            pnpm publish --no-git-checks --access public
          fi
        env:
          GITHUB_REF: ${{ github.ref }}
        working-directory: ts
