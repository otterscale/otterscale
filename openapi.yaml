openapi: 3.1.0
info:
  title: OtterScale API
  description: 'OtterScale: A unified platform for simplified compute, storage, and networking.'
  contact:
    name: Chung-Hsuan Tsai
    url: https://iasthc.github.io
    email: paul_tsai@phison.com
  license:
    name: Apache 2.0
    url: https://opensource.org/license/apache-2-0
  version: v1
paths:
  /otterscale.link.v1.LinkService/ListLinks:
    post:
      tags:
        - LinkService
      summary: ListLinks
      description: |-
        ListLinks returns all cluster identifiers that the current agent
         is registered to. This is used to discover which clusters are available
         for tunnel connections.
      operationId: LinkService_ListLinks
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/otterscale.link.v1.ListLinksRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/otterscale.link.v1.ListLinksResponse'
  /otterscale.link.v1.LinkService/Register:
    post:
      tags:
        - LinkService
      summary: Register
      description: |-
        Register allows an agent to register itself with the tunnel server.
         The agent sends its cluster identity and tunnel port; the server responds
         with its fingerprint so the agent can verify the tunnel connection.
      operationId: LinkService_Register
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/otterscale.link.v1.RegisterRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/otterscale.link.v1.RegisterResponse'
  /otterscale.resource.v1.ResourceService/Apply:
    post:
      tags:
        - ResourceService
      summary: Apply
      description: |-
        Apply performs a Server-Side Apply (SSA) to update or create a resource.
         This is the recommended way to perform partial updates.
      operationId: ResourceService_Apply
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
