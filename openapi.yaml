        group:
          type: string
          title: group
          description: Kubernetes API Group (e.g., "apps" for Deployments, "" for core resources).
        version:
          type: string
          title: version
          description: Kubernetes API Version (e.g., "v1").
        resource:
          type: string
          title: resource
