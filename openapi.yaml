          type: string
          title: name
          description: The name of the VirtualMachineInstance.
      title: VNCRequest
      additionalProperties: false
      description: |-
        VNCRequest defines the parameters for starting a VNC session
         to a KubeVirt VirtualMachineInstance.
    otterscale.runtime.v1.VNCResponse:
      type: object
      properties:
        sessionId:
          type: string
          title: session_id
          description: |-
            The session identifier, set only in the first response message.
             Subsequent WriteVNC calls must reference this ID.
        data:
          type: string
          title: data
          format: byte
          description: Raw VNC protocol data received from the VMI.
      title: VNCResponse
      additionalProperties: false
      description: VNCResponse streams raw VNC protocol data from the VMI.
    otterscale.runtime.v1.WritePortForwardRequest:
      type: object
      properties:
        sessionId:
          type: string
          title: session_id
          description: The session identifier returned in the first PortForwardResponse.
        data:
          type: string
          title: data
          format: byte
          description: Data to send to the forwarded port on the pod.
      title: WritePortForwardRequest
      additionalProperties: false
      description: WritePortForwardRequest sends data to an active port-forward session.
    otterscale.runtime.v1.WriteTTYRequest:
      type: object
      properties:
        sessionId:
          type: string
          title: session_id
          description: The session identifier returned in the first ExecuteTTYResponse.
        stdin:
          type: string
          title: stdin
          format: byte
          description: Stdin data to write.
      title: WriteTTYRequest
      additionalProperties: false
      description: WriteTTYRequest sends stdin data to an active exec session.
    otterscale.runtime.v1.WriteVNCRequest:
      type: object
      properties:
        sessionId:
          type: string
          title: session_id
          description: The session identifier returned in the first VNCResponse.
        data:
          type: string
          title: data
          format: byte
          description: Raw VNC protocol data to send to the VMI.
      title: WriteVNCRequest
      additionalProperties: false
      description: WriteVNCRequest sends data to an active VNC session.
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
security: []
tags:
  - name: LinkService
    description: |-
      LinkService manages the lifecycle of agent-to-server tunnel connections,
       including registration and health checking.
  - name: ResourceService
    description: |-
      ResourceService provides a generic interface to manage any Kubernetes resources,
       including native objects (Pods, Deployments) and Custom Resource Definitions (CRDs).
  - name: RuntimeService
    description: |-
      RuntimeService provides runtime operations for Kubernetes workloads,
       including log streaming, interactive exec, port forwarding, scaling,
       and rolling restarts.
